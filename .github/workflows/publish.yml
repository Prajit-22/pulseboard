name: publish attribution
on:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PYCODE'
          import json,zlib,base64,pathlib
          files=json.loads(zlib.decompress(base64.b64decode('')))
          for p,s in files.items():
              path=pathlib.Path(p)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(s)
          PYCODE
          git config user.name "Instinct Agent"
          git config user.email "agent@instinct.com"
          git add src/components/Dashboard.tsx src/app/globals.css README.md tests/dashboard.test.tsx public/brand/tmdb.svg
          git commit -m "Add TMDB credits and correct deployed demo documentation"
          git push
