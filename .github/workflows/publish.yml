name: publish public sources
on:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PYCODE'
          import json,zlib,base64,pathlib
          files=json.loads(zlib.decompress(base64.b64decode('')))
          for p,s in files.items():
              path=pathlib.Path(p)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(base64.b64decode(s))
          PYCODE
          git config user.name "Instinct Agent"
          git config user.email "agent@instinct.com"
          git add README.md docs/demo.md .env.example src/lib/providers.ts src/lib/public-providers.ts src/components/Dashboard.tsx src/components/Card.tsx src/app/globals.css tests/logic.test.ts tests/public-providers.test.ts e2e/dashboard.spec.ts e2e/visual.spec.ts public/brand/guardian.png
          git commit -m "Add public HN and Mastodon feeds with optional Guardian coverage"
          git push
